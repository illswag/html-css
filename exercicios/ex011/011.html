<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>

    <p>Tente abrir esse site em diferentes dispositivos, ou, redimensionar a janela do navegador.</p>
    <picture>
        <source media="(max-width:1000px)" srcset="exercicios/ex011/imagens/paisagem-m.png" type="image/png">
        <source media="(max-width:600px)" srcset="exercicios/ex011/imagens/paisagem-p.png" type="image/png">
        <img src="exercicios/ex011/imagens/paisagem-p.png" alt="Paisagem">
    </picture>

    <h2>Reproduzindo áudio</h2>
    <p>Vamos aprender a reproduzir áudio no HTML.</p>
    <audio preload="auto" controls>
        <source src="exercicios/ex011/audio/guanacast-33.mp3" type="audio/mp3">
    </audio>
</body>
</html>
